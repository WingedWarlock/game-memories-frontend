<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="field">
    <label for="saga-name">Nome da Constelação *</label>
    <input id="saga-name" type="text" formControlName="name" placeholder="Ex:  Final Fantasy" />
    @if (form.controls.name.invalid && form.controls.name.touched) {
      <span class="field-error">Dê um nome pra essa constelação.</span>
    }
  </div>

  <div class="field">
    <label>Sagas para mesclar *</label>
    @if (availableSagaNames().length === 0) {
      <p class="field-hint">Nenhuma saga disponível — todas já estão em outras constelações, ou nenhum jogo tem saga cadastrada.</p>
    } @else {
      <ul class="saga-name-list">
        <li class="saga-name-item" *ngFor="let name of availableSagaNames(); trackBy: trackByName">
            <label class="checkbox-field">
              <input type="checkbox" [checked]="isSelected(name)" (change)="toggleName(name)" />
              {{ name }}
            </label>
        </li>
      </ul>
    }
  </div>

  <div class="form-actions">
    <button type="button" class="btn btn-secondary" (click)="cancelled.emit()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="availableSagaNames().length === 0">Criar Constelação</button>
  </div>
</form>
