<header class="app-header">
  <a class="brand" routerLink="/">
    <app-icon name="book" [size]="22" />
    <span class="brand-name">Game Memories</span>
  </a>

  <nav class="app-nav">
    <a class="tab" routerLink="/" routerLinkActive="tab-active" [routerLinkActiveOptions]="{ exact: true }">
      Timeline
    </a>
    <a class="tab" routerLink="/biblioteca" routerLinkActive="tab-active">Biblioteca</a>
    <a class="tab" routerLink="/estatisticas" routerLinkActive="tab-active">Estatísticas</a>
    <a class="tab" routerLink="/historico" routerLinkActive="tab-active">Histórico</a>
    <a class="tab" routerLink="/retrospectiva" routerLinkActive="tab-active">Retrospectiva</a>
    <a class="tab" routerLink="/momentos" routerLinkActive="tab-active">Momentos</a>
    <a class="tab" routerLink="/musicas" routerLinkActive="tab-active">Músicas</a>
    <a class="tab" routerLink="/museu" routerLinkActive="tab-active">Museu</a>
    <a class="tab tab-constellation" routerLink="/constelacoes" routerLinkActive="tab-active">
      <svg class="tab-constellation-glow" viewBox="0 0 120 40" aria-hidden="true">
        <line x1="8" y1="30" x2="34" y2="9" />
        <line x1="34" y1="9" x2="60" y2="23" />
        <line x1="60" y1="23" x2="90" y2="7" />
        <line x1="90" y1="7" x2="112" y2="27" />
        <circle cx="8" cy="30" r="1.8" />
        <circle cx="34" cy="9" r="2.2" />
        <circle cx="60" cy="23" r="1.8" />
        <circle cx="90" cy="7" r="2.4" />
        <circle cx="112" cy="27" r="1.8" />
      </svg>
      <span class="tab-label-stack">
        <span class="tab-label tab-label-primary">Constelações</span>
        <span class="tab-label tab-label-alt">Sagas</span>
      </span>
    </a>
  </nav>
</header>

<router-outlet />

<app-toast-stack />
